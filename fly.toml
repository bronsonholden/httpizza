# fly.toml app configuration file generated for httpizza on 2023-09-30T17:07:44-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "httpizza"
primary_region = "sea"
kill_signal = "SIGTERM"
swap_size_mb = 512

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "httpizza.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000
